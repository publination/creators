<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Busca de Creators Publi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .faixa { padding-block: 28px 32px; }
  .faixa h1 { font-size: clamp(30px, 5vw, 44px); max-width: none; }
  .miolo { max-width: 1180px; }
  .entrar { max-width: 420px; display: grid; gap: 14px; }
  .filtros {
    display: grid; gap: 12px;
    grid-template-columns: 2fr repeat(4, 1fr) 0.7fr 0.7fr;
    align-items: end;
    background: var(--superficie); border-radius: var(--raio); padding: 16px;
  }
  .filtros > * { min-width: 0; }
  .filtros label { font-size: 13px; }
  @media (max-width: 1000px) { .filtros { grid-template-columns: 1fr 1fr 1fr; } .filtros .busca-texto { grid-column: 1 / -1; } }
  @media (max-width: 560px) { .filtros { grid-template-columns: 1fr 1fr; } }
  .barra { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 20px 0 14px; }
  .total { font-weight: 700; font-variant-numeric: tabular-nums; }
  .cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card {
    border: 1.5px solid var(--linha); border-radius: var(--raio); padding: 18px;
    display: grid; gap: 12px; align-content: start; background: var(--fundo); min-width: 0;
  }
  .topo { display: flex; gap: 14px; align-items: center; min-width: 0; }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%; flex: none; overflow: hidden;
    background: var(--degrade); color: #1c1a19;
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 22px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .topo > div { min-width: 0; }
  .card h3 { font-size: 19px; overflow-wrap: anywhere; }
  .meta { color: var(--tinta-suave); font-size: 14px; }
  .redes { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; font-weight: 600; }
  .redes a { text-decoration: none; border-bottom: 1.5px solid var(--carmim); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--superficie); }
  .tag.nicho { background: var(--tinta); color: var(--fundo); }
  .tag.seg { background: var(--degrade); color: #1c1a19; font-weight: 700; }
  .bio { font-size: 14px; margin: 0; overflow-wrap: anywhere; }
  .refs { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  .contato { display: grid; gap: 6px; border-top: 1px solid var(--linha); padding-top: 12px; font-size: 14px; }
  .contato div { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; }
  .contato span { overflow-wrap: anywhere; min-width: 0; }
  .copiar { font: inherit; font-size: 12px; font-weight: 700; background: none; border: 1.5px solid var(--linha); color: var(--tinta); border-radius: 999px; padding: 4px 10px; cursor: pointer; flex: none; }
  .copiar:hover { border-color: var(--tinta); }
  .vazio { padding: 48px 16px; text-align: center; color: var(--tinta-suave); }
  .mais { display: flex; justify-content: center; margin-top: 24px; }
</style>
</head>
<body>

<header class="faixa">
  <div class="faixa-interna" style="max-width:1148px">
    <div class="marca"><span class="marca-icone" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h6L9.5 22 19 9.5h-6.2L13.5 2Z" fill="#ffd54f" stroke="#1c1a19" stroke-width="1.2" stroke-linejoin="round"/></svg></span><span class="marca-nome"><b>PUBLI</b><span>NATION</span></span><span class="marca-extra">uso interno</span></div>
    <h1>Busca de <em>creators</em></h1>
  </div>
</header>

<main class="miolo">
  <form id="entrar" class="entrar">
    <h2 style="font-size:24px">Acesso da equipe</h2>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required>
    </div>
    <div id="aviso-entrar" class="aviso erro" role="alert" hidden></div>
    <div><button class="botao" type="submit" id="btn-entrar">Entrar</button></div>
  </form>

  <section id="painel" hidden>
    <div class="filtros">
      <div class="campo busca-texto">
        <label for="f-texto">Buscar</label>
        <input type="search" id="f-texto" placeholder="Nome, @, cidade ou palavra da bio">
      </div>
      <div class="campo"><label for="f-nicho">Nicho</label><select id="f-nicho"><option value="">Todos</option></select></div>
      <div class="campo"><label for="f-estado">Estado</label><select id="f-estado"><option value="">Todos</option></select></div>
      <div class="campo"><label for="f-seg">Seguidores</label><select id="f-seg"><option value="">Todas as faixas</option></select></div>
      <div class="campo"><label for="f-formato">Formato</label><select id="f-formato"><option value="">Todos</option></select></div>
      <div class="campo"><label for="f-idmin">Idade mín.</label><input type="number" id="f-idmin" min="0" max="99" inputmode="numeric"></div>
      <div class="campo"><label for="f-idmax">Idade máx.</label><input type="number" id="f-idmax" min="0" max="99" inputmode="numeric"></div>
    </div>
    <div class="barra">
      <div class="total" id="total" aria-live="polite"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="botao-sec" type="button" id="limpar">Limpar filtros</button>
        <button class="botao-sec" type="button" id="atualizar">Atualizar lista</button>
      </div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="mais"><button class="botao-sec" type="button" id="mais" hidden>Mostrar mais</button></div>
  </section>
</main>

<script src="config.js"></script>
<script>
(function () {
  var SEGUIDORES = ["Até 10 mil","10 a 50 mil","50 a 100 mil","100 a 500 mil","500 mil a 1 milhão","Mais de 1 milhão"];
  var POR_PAGINA = 48;
  var todos = [], filtrados = [], mostrando = 0, senha = "";
  var $ = function (id) { return document.getElementById(id); };

  function guardar(s) { try { sessionStorage.setItem("basePubliSenha", s); } catch (e) {} }
  function lerGuardada() { try { return sessionStorage.getItem("basePubliSenha") || ""; } catch (e) { return ""; } }

  function idade(txt) {
    if (!txt) return null;
    var a, m, d, p;
    if ((p = txt.match(/^(\d{4})-(\d{2})-(\d{2})/))) { a = +p[1]; m = +p[2]; d = +p[3]; }
    else if ((p = txt.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) { d = +p[1]; m = +p[2]; a = +p[3]; }
    else return null;
    var h = new Date(), r = h.getFullYear() - a;
    if (h.getMonth() + 1 < m || (h.getMonth() + 1 === m && h.getDate() < d)) r--;
    return r;
  }
  function semAcento(s) { return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function lista(s) { return (s || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean); }

  function carregar() {
    var url = window.BASE_PUBLI && window.BASE_PUBLI.SCRIPT_URL;
    if (!url || url.indexOf("http") !== 0) { erroEntrar("A URL do Apps Script ainda não foi colocada no arquivo config.js."); return Promise.resolve(); }
    $("btn-entrar").disabled = true; $("btn-entrar").textContent = "Carregando...";
    $("total").textContent = "Carregando...";
    return fetch(url + "?acao=listar&senha=" + encodeURIComponent(senha))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) {
          guardar("");
          $("painel").hidden = true; $("entrar").hidden = false;
          erroEntrar(res.erro === "senha" ? "Senha incorreta." : "Não foi possível carregar a lista.");
          return;
        }
        guardar(senha);
        // Mantém só o cadastro mais recente de cada @
        var mapa = {};
        res.creators.forEach(function (c) { mapa[c.instagram] = c; });
        todos = Object.keys(mapa).map(function (k) {
          var c = mapa[k];
          c._idade = idade(c.nascimento);
          c._nichos = lista(c.nichos);
          c._formatos = lista(c.formatos);
          c._busca = semAcento([c.nome, c.instagram, c.tiktok, c.cidade, c.estado, c.bio, c.nichos].join(" "));
          return c;
        }).sort(function (a, b) { return (b.dataCadastro || "").localeCompare(a.dataCadastro || ""); });
        montarFiltros();
        $("entrar").hidden = true; $("painel").hidden = false;
        filtrar();
      })
      .catch(function () { erroEntrar("Não foi possível conectar. Tente de novo."); })
      .then(function () { $("btn-entrar").disabled = false; $("btn-entrar").textContent = "Entrar"; });
  }
  function erroEntrar(t) { $("aviso-entrar").textContent = t; $("aviso-entrar").hidden = false; }

  function preencherSelect(id, valores) {
    var sel = $(id), atual = sel.value;
    while (sel.options.length > 1) sel.remove(1);
    valores.forEach(function (v) { var o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
    sel.value = atual;
  }
  function unicos(fn) {
    var s = {};
    todos.forEach(function (c) { fn(c).forEach(function (v) { if (v) s[v] = 1; }); });
    return Object.keys(s).sort(function (a, b) { return a.localeCompare(b, "pt-BR"); });
  }
  function montarFiltros() {
    preencherSelect("f-nicho", unicos(function (c) { return c._nichos; }));
    preencherSelect("f-estado", unicos(function (c) { return [c.estado]; }));
    preencherSelect("f-formato", unicos(function (c) { return c._formatos; }));
    var segs = unicos(function (c) { return [c.seguidores]; });
    preencherSelect("f-seg", SEGUIDORES.filter(function (s) { return segs.indexOf(s) > -1; }));
  }

  function filtrar() {
    var t = semAcento($("f-texto").value.trim()).replace(/^@/, "");
    var nicho = $("f-nicho").value, uf = $("f-estado").value, seg = $("f-seg").value, fmt = $("f-formato").value;
    var min = $("f-idmin").value === "" ? null : +$("f-idmin").value;
    var max = $("f-idmax").value === "" ? null : +$("f-idmax").value;
    filtrados = todos.filter(function (c) {
      if (t && c._busca.indexOf(t) === -1) return false;
      if (nicho && c._nichos.indexOf(nicho) === -1) return false;
      if (uf && c.estado !== uf) return false;
      if (seg && c.seguidores !== seg) return false;
      if (fmt && c._formatos.indexOf(fmt) === -1) return false;
      if (min !== null && (c._idade === null || c._idade < min)) return false;
      if (max !== null && (c._idade === null || c._idade > max)) return false;
      return true;
    });
    var n = filtrados.length;
    $("total").textContent = n.toLocaleString("pt-BR") + (n === 1 ? " creator encontrado" : " creators encontrados") + " de " + todos.length.toLocaleString("pt-BR");
    $("cards").innerHTML = ""; mostrando = 0;
    if (!n) {
      var v = document.createElement("div"); v.className = "vazio";
      v.textContent = todos.length ? "Nenhum creator com esses filtros. Tente tirar algum." : "Ainda não tem ninguém cadastrado. Assim que o link for divulgado, os cadastros aparecem aqui.";
      $("cards").appendChild(v);
    }
    mostrarMais();
  }

  function el(tag, cls, texto) { var e = document.createElement(tag); if (cls) e.className = cls; if (texto != null) e.textContent = texto; return e; }
  function link(href, texto) { var a = el("a", null, texto); a.href = href; a.target = "_blank"; a.rel = "noopener"; return a; }
  function seguro(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
  function iniciais(n) { return (n || "?").trim().split(/\s+/).slice(0, 2).map(function (p) { return p[0]; }).join("").toUpperCase(); }

  function linhaContato(rotulo, valor, extra) {
    var d = el("div");
    var s = el("span"); s.appendChild(el("strong", null, rotulo + ": "));
    if (extra) s.appendChild(extra); else s.appendChild(document.createTextNode(valor));
    var b = el("button", "copiar", "Copiar"); b.type = "button";
    b.addEventListener("click", function () {
      var ok = function () { b.textContent = "Copiado"; setTimeout(function () { b.textContent = "Copiar"; }, 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(valor).then(ok, function () {});
    });
    d.appendChild(s); d.appendChild(b); return d;
  }

  function card(c) {
    var k = el("article", "card");
    var topo = el("div", "topo");
    var av = el("div", "avatar");
    if (seguro(c.foto)) { var im = new Image(); im.src = c.foto; im.alt = ""; im.loading = "lazy"; im.onerror = function () { av.textContent = iniciais(c.nome); }; av.appendChild(im); }
    else av.textContent = iniciais(c.nome);
    var info = el("div");
    info.appendChild(el("h3", null, c.nome));
    var partes = [];
    if (c._idade !== null) partes.push(c._idade + " anos");
    if (c.cidade || c.estado) partes.push([c.cidade, c.estado].filter(Boolean).join("/"));
    info.appendChild(el("div", "meta", partes.join(" · ")));
    topo.appendChild(av); topo.appendChild(info); k.appendChild(topo);

    var redes = el("div", "redes");
    redes.appendChild(link("https://www.instagram.com/" + encodeURIComponent(c.instagram) + "/", "@" + c.instagram));
    if (c.tiktok) redes.appendChild(link("https://www.tiktok.com/@" + encodeURIComponent(c.tiktok), "TikTok @" + c.tiktok));
    k.appendChild(redes);

    var tags = el("div", "tags");
    if (c.seguidores) tags.appendChild(el("span", "tag seg", c.seguidores));
    c._nichos.forEach(function (n) { tags.appendChild(el("span", "tag nicho", n)); });
    c._formatos.forEach(function (f) { tags.appendChild(el("span", "tag", f)); });
    k.appendChild(tags);

    if (c.bio) k.appendChild(el("p", "bio", c.bio));

    var refs = [c.ref1, c.ref2, c.ref3].map(seguro).filter(Boolean);
    if (refs.length) {
      var r = el("div", "refs"); r.appendChild(el("strong", null, "Referências:"));
      refs.forEach(function (u, i) { r.appendChild(link(u, "Conteúdo " + (i + 1))); });
      k.appendChild(r);
    }

    var ct = el("div", "contato");
    if (c.whatsapp) {
      var num = c.whatsapp.replace(/\D/g, "");
      if (num.length <= 11) num = "55" + num;
      ct.appendChild(linhaContato("WhatsApp", c.whatsapp, link("https://wa.me/" + num, c.whatsapp)));
    }
    if (c.email) ct.appendChild(linhaContato("E-mail", c.email));
    if (c.responsavel) ct.appendChild(el("div", "meta", "Menor de idade. Responsável: " + c.responsavel));
    ct.appendChild(el("div", "meta", "Cadastro em " + (c.dataCadastro || "").slice(0, 10).split("-").reverse().join("/")));
    k.appendChild(ct);
    return k;
  }

  function mostrarMais() {
    var frag = document.createDocumentFragment();
    filtrados.slice(mostrando, mostrando + POR_PAGINA).forEach(function (c) { frag.appendChild(card(c)); });
    $("cards").appendChild(frag);
    mostrando = Math.min(filtrados.length, mostrando + POR_PAGINA);
    $("mais").hidden = mostrando >= filtrados.length;
  }

  var espera;
  ["f-texto", "f-idmin", "f-idmax"].forEach(function (id) { $(id).addEventListener("input", function () { clearTimeout(espera); espera = setTimeout(filtrar, 200); }); });
  ["f-nicho", "f-estado", "f-seg", "f-formato"].forEach(function (id) { $(id).addEventListener("change", filtrar); });
  $("mais").addEventListener("click", mostrarMais);
  $("limpar").addEventListener("click", function () {
    ["f-texto", "f-nicho", "f-estado", "f-seg", "f-formato", "f-idmin", "f-idmax"].forEach(function (id) { $(id).value = ""; });
    filtrar();
  });
  $("atualizar").addEventListener("click", carregar);
  $("entrar").addEventListener("submit", function (e) {
    e.preventDefault(); $("aviso-entrar").hidden = true;
    senha = $("senha").value; carregar();
  });

  senha = lerGuardada();
  if (senha) carregar();
})();
</script>
</body>
</html>
